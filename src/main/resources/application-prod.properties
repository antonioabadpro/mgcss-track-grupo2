# Production Environment (Configurable Future Database)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mgcssdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# JPA/Hibernate Production Settings
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
