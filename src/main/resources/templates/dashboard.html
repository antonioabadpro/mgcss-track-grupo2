<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: html(view='dashboard', headerTitulo='Dashboard Analítico', headerSubtitulo='KPIs y cumplimiento de Acuerdos de Nivel de Servicio (SLA)', content=~{::div})}">
<body>
<div>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px;">
        <div style="background: white; padding: 20px; border-radius: 8px; border: 1px solid var(--border); border-top: 4px solid var(--primary); text-align: center;">
            <h3 style="margin-top:0; color: #64748b; font-size: 14px;">Total Solicitudes</h3>
            <div style="font-size: 32px; font-weight: bold; color: var(--text);" th:text="${metricas.totalSolicitudes}">0</div>
        </div>
        <div style="background: white; padding: 20px; border-radius: 8px; border: 1px solid var(--border); border-top: 4px solid var(--warning); text-align: center;">
            <h3 style="margin-top:0; color: #64748b; font-size: 14px;">En Proceso</h3>
            <div style="font-size: 32px; font-weight: bold; color: var(--text);" th:text="${metricas.totalEnProceso}">0</div>
        </div>
        <div style="background: white; padding: 20px; border-radius: 8px; border: 1px solid var(--border); border-top: 4px solid var(--danger); text-align: center;">
            <h3 style="margin-top:0; color: #64748b; font-size: 14px;">Incumpliendo SLA</h3>
            <div style="font-size: 32px; font-weight: bold; color: var(--danger);" th:text="${metricas.incumplenSla}">0</div>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
        <div style="background: white; padding: 20px; border-radius: 8px; border: 1px solid var(--border);">
            <h3 style="margin-top: 0; color: var(--primary);">Resumen de Estados</h3>
            <ul style="list-style: none; padding: 0;">
                <li style="padding: 10px 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between;">
                    <span>Abiertas</span><span class="badge badge-abierta" th:text="${metricas.totalAbiertas}"></span>
                </li>
                <li style="padding: 10px 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between;">
                    <span>En Proceso</span><span class="badge badge-enproceso" th:text="${metricas.totalEnProceso}"></span>
                </li>
                <li style="padding: 10px 0; display: flex; justify-content: space-between;">
                    <span>Cerradas</span><span class="badge badge-cerrada" th:text="${metricas.totalCerradas}"></span>
                </li>
            </ul>
        </div>
        <div style="background: white; padding: 20px; border-radius: 8px; border: 1px solid var(--border);">
            <h3 style="margin-top: 0; color: var(--primary);">Rendimiento</h3>
            <div style="text-align: center; margin-top: 20px;">
                <div style="font-size: 48px; font-weight: bold; color: var(--success);" th:text="${metricas.tiempoMedio}">0.0</div>
                <div style="color: #64748b; font-size: 14px;">Días de media para resolución</div>
            </div>
        </div>
    </div>

    <h3 style="margin-top: 30px; color: var(--danger);">⚠️ Solicitudes que superan el SLA máximo</h3>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Estado</th>
                    <th>Creación</th>
                    <th>Técnico</th>
                    <th>Max. Permitido</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${metricas.solicitudesIncumplenSla}">
                    <td th:text="'#' + ${s.id}"></td>
                    <td><span class="badge badge-cerrada" th:text="${s.estado}"></span></td>
                    <td th:text="${s.fechaCreacion}"></td>
                    <td th:text="${s.tecnico != null ? s.tecnico.nombre : 'Sin asignar'}"></td>
                    <td th:text="${s.tiempoMaximo} + ' días'"></td>
                </tr>
                <tr th:if="${metricas.solicitudesIncumplenSla.empty}">
                    <td colspan="5" style="text-align: center; color: var(--success);">✅ No hay incumplimientos de SLA registrados.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
