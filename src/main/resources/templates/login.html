<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGCSS - Inicio de Sesión</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; padding-top: 0; background-color: var(--footer-bg); }
        .login-container { background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .login-container h2 { text-align: center; color: var(--primary); margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #475569; }
        .form-group input { width: 100%; }
        .btn-login { width: 100%; padding: 12px; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>MGCSS SAT</h2>
    <p style="text-align: center; color: #64748b; margin-bottom: 30px;">Inicio de Sesión</p>

    <div th:if="${param.error}" class="notificacion error">Usuario o contraseña incorrectos.</div>
    <div th:if="${param.logout}" class="notificacion exito">Has cerrado sesión correctamente.</div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="username" class="input-form" placeholder="admin / user" required autofocus>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" class="input-form" placeholder="admin123 / user123" required>
        </div>
        <button type="submit" class="btn-primary btn-login">Entrar al Panel</button>
    </form>
</div>

</body>
</html>
